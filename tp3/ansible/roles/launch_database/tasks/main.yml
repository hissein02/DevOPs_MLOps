- name: Run PostgreSQL container
  docker_container:
    name: my_postgres
    image: hissein/tp-devops-database
    pull: true
    recreate: true
    force_kill: true
    networks:
      - name: backend_network
    env:
      POSTGRES_USER: "{{POSTGRES_USER}}"
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
      POSTGRES_DB: "{{POSTGRES_DB}}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    state: started